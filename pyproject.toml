[project]
name = "campaign-insights"
version = "0.1.0"
description = "Analyse Facebook ad campaign performance and get budget recommendations"
readme = "README.md"
authors = [
    { name = "mina-motaghinasab", email = "m.mottaghinasab@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
